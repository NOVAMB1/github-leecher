name: دانلود چند پارت multi

on:
  workflow_dispatch:
    inputs:
      link1:
        description: 'لینک 1'
        required: false
        type: string
      link2:
        description: 'لینک 2'
        required: false
        type: string
      link3:
        description: 'لینک 3'
        required: false
        type: string
      link4:
        description: 'لینک 4'
        required: false
        type: string
      link5:
        description: 'لینک 5'
        required: false
        type: string

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: نصب 7z
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full wget

      - name: دانلود فایل‌ها
        run: |
          mkdir -p downloads
          cd downloads

          download_file () {
            URL="$1"
            NUM="$2"

            echo "⬇️ دانلود لینک $NUM"

            wget \
              --no-check-certificate \
              --content-disposition \
              --tries=999 \
              --waitretry=5 \
              --read-timeout=30 \
              --timeout=30 \
              --continue \
              -O "file_$NUM" \
              "$URL" || true

            SIZE=$(stat -c%s "file_$NUM" 2>/dev/null || echo 0)

            echo "📦 حجم دانلود شده: $SIZE"

            if [ "$SIZE" -lt 100000 ]; then
              echo "❌ دانلود نشد"
              exit 1
            fi

            echo "✅ اوکی"
          }

          [ -n "${{ inputs.link1 }}" ] && download_file "${{ inputs.link1 }}" "1"
          [ -n "${{ inputs.link2 }}" ] && download_file "${{ inputs.link2 }}" "2"
          [ -n "${{ inputs.link3 }}" ] && download_file "${{ inputs.link3 }}" "3"
          [ -n "${{ inputs.link4 }}" ] && download_file "${{ inputs.link4 }}" "4"
          [ -n "${{ inputs.link5 }}" ] && download_file "${{ inputs.link5 }}" "5"

          cd ..

          COUNT=$(ls downloads/ | wc -l)

          if [ "$COUNT" -eq 0 ]; then
            echo "❌ هیچ فایل دانلود نشد"
            exit 1
          fi

          TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
          echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV

      - name: فشرده و پارت بندی
        run: |
          7z a -v95m -mx3 "archive_${{ env.TIMESTAMP }}.7z" downloads/
          rm -rf downloads

      - name: ساخت فایل لینک
        run: |
          RANDOM_NUM=$((RANDOM % 90000 + 10000))
          LINKS_FILE="links_${RANDOM_NUM}.txt"

          echo "=== لینک‌های دانلود ===" > $LINKS_FILE
          echo "" >> $LINKS_FILE

          for file in archive_${{ env.TIMESTAMP }}.7z.*; do
            if [ -f "$file" ]; then
              echo "https://raw.githubusercontent.com/${{ github.repository }}/main/$file" >> $LINKS_FILE
            fi
          done

          echo "LINKS_FILE=$LINKS_FILE" >> $GITHUB_ENV

      - name: ارسال به ریپو
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add archive_${{ env.TIMESTAMP }}.7z.*
          git add ${{ env.LINKS_FILE }}

          git commit -m "download" || echo "done"

          git push

      - name: نمایش لینک
        run: |
          echo "✅ لینک:"
          echo "https://raw.githubusercontent.com/${{ github.repository }}/main/${{ env.LINKS_FILE }}"
