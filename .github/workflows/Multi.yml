name: دانلود چند پارت multi

on:
  workflow_dispatch:
    inputs:
      link1:
        description: 'لینک 1'
        required: false
        type: string
      link2:
        description: 'لینک 2'
        required: false
        type: string
      link3:
        description: 'لینک 3'
        required: false
        type: string
      link4:
        description: 'لینک 4'
        required: false
        type: string
      link5:
        description: 'لینک 5'
        required: false
        type: string

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: نصب 7z و aria2
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full aria2
      
      - name: دانلود فایل‌ها
        run: |
          mkdir -p downloads
          cd downloads
          
          download_file () {
            URL="$1"
            NUM="$2"

            echo "⬇️ دانلود لینک $NUM: $URL"

            aria2c \
              -x 16 \
              -s 16 \
              -k 1M \
              --max-tries=0 \
              --retry-wait=5 \
              --continue=true \
              -o "file_$NUM" \
              "$URL"
          }
          
          # چک کردن لینک 1
          if [ -n "${{ inputs.link1 }}" ]; then
            download_file "${{ inputs.link1 }}" "1"
          fi
          
          # چک کردن لینک 2
          if [ -n "${{ inputs.link2 }}" ]; then
            download_file "${{ inputs.link2 }}" "2"
          fi
          
          # چک کردن لینک 3
          if [ -n "${{ inputs.link3 }}" ]; then
            download_file "${{ inputs.link3 }}" "3"
          fi
          
          # چک کردن لینک 4
          if [ -n "${{ inputs.link4 }}" ]; then
            download_file "${{ inputs.link4 }}" "4"
          fi
          
          # چک کردن لینک 5
          if [ -n "${{ inputs.link5 }}" ]; then
            download_file "${{ inputs.link5 }}" "5"
          fi
          
          cd ..
          
          COUNT=$(ls downloads/ | wc -l)
          echo "✅ تعداد فایل‌های دانلود شده: $COUNT"
          
          if [ $COUNT -eq 0 ]; then
            echo "❌ هیچ فایلی دانلود نشد"
            exit 1
          fi
          
          TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
          echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV
      
      - name: فشرده و پارت بندی
        run: |
          7z a -v95m -mx3 "archive_${{ env.TIMESTAMP }}.7z" downloads/
          rm -rf downloads
      
      - name: ساخت فایل لینک
        run: |
          RANDOM_NUM=$((RANDOM % 90000 + 10000))
          LINKS_FILE="links_${RANDOM_NUM}.txt"
          
          echo "=== لینک‌های دانلود ===" > $LINKS_FILE
          echo "تاریخ: $(date)" >> $LINKS_FILE
          echo "" >> $LINKS_FILE
          
          for file in archive_${{ env.TIMESTAMP }}.7z.*; do
            if [ -f "$file" ]; then
              echo "https://raw.githubusercontent.com/${{ github.repository }}/main/$file" >> $LINKS_FILE
            fi
          done
          
          echo "LINKS_FILE=$LINKS_FILE" >> $GITHUB_ENV
      
      - name: ارسال به ریپو
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add archive_${{ env.TIMESTAMP }}.7z.*
          git add ${{ env.LINKS_FILE }}
          git commit -m "download" || echo "done"
          git push
      
      - name: نمایش لینک
        run: |
          echo "✅ https://raw.githubusercontent.com/${{ github.repository }}/main/${{ env.LINKS_FILE }}"
